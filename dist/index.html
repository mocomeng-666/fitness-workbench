<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7FB069">
<title>个人健身训练工作台</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
/* styles.css — 个人健身训练工作台 V1.3（米色杂志风，克制、高级、生活感）
 * 模块页色/蜂蜜黄退场：顶栏恒 --bg 米底；彩色只做识别与强调。
 */
:root {
  /* 底色阶 */
  --bg: #F5F0E6;          /* 米色页面底 */
  --card: #FCFAF3;        /* 卡片 */
  --cream: #FFFDF8;       /* 高亮卡/弹层内底 */
  --ink: #3A362C;         /* 暖墨正文 */
  --ink-sub: #8B8577;     /* 次级说明 */
  --border: #E6E0D1;
  /* 主色（抹茶绿，不变） */
  --main: #7FB069;
  --main-dark: #5A8F4A;
  --main-bg: #E9F0E2;
  /* 强调（深紫：成果区/提醒/关键数字/周报小标） */
  --accent: #6F5F9E;
  --accent-soft: #EFEBF5;
  /* 安全语义 */
  --warn: #C2410C;
  --danger: #B91C1C;
  /* 训练类型字色/浅底（识别色，不做整块） */
  --cardio: #557E9E;  --cardio-bg: #E3EBF0;
  --posture: #B96A38; --posture-bg: #F4E6DA;
  --rest: #6F6D68;    --rest-bg: #ECEAE4;
  /* 圆角 / 间距 */
  --radius-card: 20px;
  --radius-btn: 12px;
  --radius-badge: 10px;
  --radius-sm: 8px;
  --shadow-soft: 0 1px 2px rgba(0,0,0,0.04);
  /* V1.5 ⑥：语义辅助 token（主题可覆盖） */
  --btn-text: #FFFFFF;
  --danger-bg: #F6E0DE;
  --warn-bg: #F7E6D6;
  --warn-ink: #7C2D12;
}

/* V1.5 ⑥：皮肤「莓果」（浅藕底 + 莓果紫红主色 + 香槟金点缀，浓艳女性向） */
body[data-theme="berry"] {
  --bg: #FAF0F5; --card: #FFFBFE; --cream: #FFF8FC;
  --ink: #542E43; --ink-sub: #96798E; --border: #EBDCE6;
  --main: #C4457A; --main-dark: #A12F60; --main-bg: #F7E3EC;
  --accent: #A97E2F; --accent-soft: #F6EFDB;
  --warn: #C05A17; --danger: #B3261E;
  --btn-text: #FFFFFF;
  --danger-bg: #F8E0E2; --warn-bg: #F7ECD8; --warn-ink: #7C3F0E;
}

/* V1.5 ⑥：皮肤「暗夜」（墨绿黑底 + 青柠主色 + 琥珀点缀，深色运动向） */
body[data-theme="night"] {
  --bg: #1B221D; --card: #242E27; --cream: #2B362D;
  --ink: #EDF1EA; --ink-sub: #A3B0A3; --border: #39463C;
  --main: #A6C94E; --main-dark: #86A83A; --main-bg: #2E3A24;
  --accent: #E0B04F; --accent-soft: #3A3324;
  --cardio: #7FB0D9; --cardio-bg: #22303C;
  --posture: #E09A62; --posture-bg: #3A2C20;
  --rest: #9AA597; --rest-bg: #31382F;
  --warn: #F2A65E; --danger: #EF7A6E;
  --btn-text: #1B221D;
  --danger-bg: #482A28; --warn-bg: #463424; --warn-ink: #F5C98C;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 16px;
  line-height: 1.55;
}

#app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}
@media (min-width: 900px) { #app { max-width: 640px; } }

/* ===== 顶栏（恒米底，不再随模块变色） ===== */
#app-header {
  position: sticky; top: 0; z-index: 10;
  background: var(--bg);
  color: var(--ink);
  padding: calc(env(safe-area-inset-top, 0px) + 16px) 20px 14px;
  border-bottom: 1px solid var(--border);
}
#app-header.hdr-today,
#app-header.hdr-plan,
#app-header.hdr-progress,
#app-header.hdr-library,
#app-header.hdr-settings { background: var(--bg); color: var(--ink); }
#page-title { font-size: 20px; font-weight: 700; letter-spacing: .02em; }

#main { flex: 1; padding: 20px 16px 96px; }
.page.hidden, .hidden { display: none !important; }

/* ===== 底部 Tab（V1.3：激活=抹茶绿加粗 + 文字前小圆点） ===== */
#tabbar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px;
  display: flex;
  background: var(--card);
  border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  z-index: 20;
}
@media (min-width: 900px) { #tabbar { max-width: 640px; } }
.tab {
  flex: 1; min-height: 58px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; border: none; background: none;
  font-size: 12px; color: var(--ink-sub); cursor: pointer; position: relative;
}
.tab .tab-ico { font-size: 19px; line-height: 1; position: relative; }
.tab.active { color: var(--ink); font-weight: 700; }
.tab.active .tab-lbl::before {
  content: ''; display: inline-block; width: 5px; height: 5px;
  border-radius: 50%; background: var(--main); margin-right: 5px; vertical-align: 1px;
}
/* D3：计划未确认时 Tab 红点 */
.tab-dot {
  position: absolute; top: -5px; right: -12px;
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--danger); display: none;
}
.tab-dot.show { display: block; }

/* ===== 通用组件 ===== */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-soft);
}
.card.cream { background: var(--cream); border-color: transparent; }
.card h2 { font-size: 17px; font-weight: 700; letter-spacing: .02em; margin-bottom: 10px; }
.card h3 { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
.sub { color: var(--ink-sub); font-size: 14px; }
.small { font-size: 12px; color: var(--ink-sub); }

.btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 46px; padding: 0 18px;
  border-radius: var(--radius-btn); border: none;
  font-size: 16px; font-weight: 600; cursor: pointer; letter-spacing: .01em;
  background: var(--main); color: var(--btn-text);
}
.btn:active { opacity: 0.85; }
.btn-secondary {
  background: var(--cream); color: var(--ink);
  border: 1px solid var(--border);
}
.btn-danger { background: var(--danger); }
.btn-warn { background: var(--warn); }
.btn-block { width: 100%; }
.btn + .btn { margin-top: 8px; }
.btn-row { display: flex; gap: 8px; }
.btn-row .btn { flex: 1; margin-top: 0; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* 类型徽章（训练类型识别） */
.badge {
  display: inline-block; padding: 3px 10px; border-radius: var(--radius-badge);
  font-size: 12px; font-weight: 600; white-space: nowrap;
}
.badge.t-strength { background: var(--main-bg); color: var(--main-dark); }
.badge.t-cardio { background: var(--cardio-bg); color: var(--cardio); }
.badge.t-posture { background: var(--posture-bg); color: var(--posture); }
.badge.t-rest { background: var(--rest-bg); color: var(--rest); }
.badge.accent { background: var(--accent-soft); color: var(--accent); }
.badge.subtle { background: var(--cream); color: var(--ink-sub); border: 1px solid var(--border); }
.badge.red { background: var(--danger-bg); color: var(--danger); }
.badge.orange { background: var(--warn-bg); color: var(--warn); }

/* V1.3/V1.4：动作部位小标（克制中性浅紫小胶囊，多标签并排） */
.part-tag {
  display: inline-block; padding: 2px 8px; margin-left: 6px; vertical-align: 1px;
  border-radius: 10px; background: var(--accent-soft); color: var(--accent);
  font-size: 11px; font-weight: 600; white-space: nowrap;
}
.part-tag + .part-tag { margin-left: 4px; }

/* V1.3 C5：部位轻提示细条 */
.body-tip {
  display: flex; align-items: flex-start; gap: 8px;
  background: var(--accent-soft);
  border-left: 3px solid var(--accent);
  border-radius: 6px;
  padding: 7px 10px;
  margin: 6px 0 10px;
  font-size: 12px; line-height: 1.5; color: var(--ink-sub);
}
.body-tip .bt-x {
  flex: none; margin-left: auto;
  border: none; background: none; cursor: pointer;
  font-size: 13px; line-height: 1.4; color: var(--ink-sub);
  padding: 0 2px;
}

input, select, textarea {
  width: 100%; min-height: 44px;
  padding: 8px 12px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-size: 16px; background: var(--cream); color: var(--ink);
  font-family: inherit;
}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; appearance: textfield; }
label.field { display: block; margin-bottom: 12px; }
label.field > span { display: block; font-size: 14px; color: var(--ink-sub); margin-bottom: 4px; }

.row { display: flex; align-items: center; gap: 8px; }
.row.between { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* 单选 chip */
.radio-chip {
  display: inline-flex; align-items: center; justify-content: center; min-height: 42px;
  padding: 6px 16px; margin: 0 6px 6px 0;
  border: 1.5px solid var(--border); border-radius: 999px;
  font-size: 15px; cursor: pointer; background: var(--cream); color: var(--ink);
}
.radio-chip.on { border-color: var(--main); background: var(--main-bg); color: var(--main-dark); font-weight: 600; }

/* V1.3 C1：身体三档（chip + 副标小字） */
.body-opt { margin-bottom: 6px; }
.body-opt .radio-chip { margin-bottom: 2px; }
.opt-sub { font-size: 12px; color: var(--ink-sub); margin: 0 0 10px 2px; }

/* ===== 排期编辑器（7 天三态） ===== */
.sched-day {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 0; border-bottom: 1px solid var(--border);
}
.sched-day:last-child { border-bottom: none; }
.sched-day .dow { width: 44px; font-weight: 600; font-size: 14px; color: var(--ink); }
.sched-opts { display: flex; gap: 6px; flex: 1; }
.sched-opt {
  flex: 1; min-height: 40px; border-radius: var(--radius-sm);
  border: 1.5px solid var(--border);
  background: var(--cream); font-size: 13px; cursor: pointer; color: var(--ink-sub);
}
.sched-opt.on.t-strength { border-color: var(--main); background: var(--main-bg); color: var(--main-dark); font-weight: 700; }
.sched-opt.on.t-cardio { border-color: var(--cardio); background: var(--cardio-bg); color: var(--cardio); font-weight: 700; }
.sched-opt.on.t-rest { border-color: var(--rest); background: var(--rest-bg); color: var(--rest); font-weight: 700; }

/* ===== 动作卡 / 组记录 ===== */
.ex-card { border-left: 4px solid var(--main); }
.ex-card.t-cardio { border-left-color: var(--cardio); }
.ex-card.t-posture { border-left-color: var(--posture); }
.set-row {
  display: grid; grid-template-columns: 44px 1fr 1fr 1fr; gap: 6px;
  align-items: end; margin-bottom: 6px;
}
.set-row .set-label { font-size: 14px; color: var(--ink-sub); padding-bottom: 10px; }

/* ===== 折叠（B7 减字） ===== */
details.fold { margin-top: 8px; }
details.fold > summary {
  cursor: pointer; font-size: 13px; color: var(--cardio);
  min-height: 32px; display: flex; align-items: center;
  list-style: none;
}
details.fold > summary::before { content: '▸ '; }
details.fold[open] > summary::before { content: '▾ '; }
details.fold ul { padding-left: 18px; }

/* ===== 弹窗 ===== */
#modal-root .modal-mask {
  position: fixed; inset: 0; background: rgba(58,54,44,0.4);
  display: flex; align-items: flex-end; justify-content: center; z-index: 100;
}
.modal-sheet {
  background: var(--cream); width: 100%; max-width: 480px;
  border-radius: 24px 24px 0 0; padding: 22px 20px calc(env(safe-area-inset-bottom, 0px) + 22px);
  max-height: 84vh; overflow-y: auto;
}
.modal-sheet h3 { margin-bottom: 10px; }

/* ===== V1.3 D2：计划页排期确认全屏视图 ===== */
.sc-mask {
  position: fixed; inset: 0; z-index: 90;
  background: var(--bg);
  display: flex; justify-content: center; align-items: flex-start;
  overflow-y: auto;
}
.sc-mask .sc-panel {
  width: 100%; max-width: 480px; margin: 0 auto;
  background: var(--cream);
  min-height: 100vh; padding: calc(env(safe-area-inset-top, 0px) + 24px) 20px calc(env(safe-area-inset-bottom, 0px) + 24px);
}
.sc-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.sc-head h3 { margin: 0; }
.sc-head .btn { min-height: 38px; font-size: 14px; padding: 0 12px; flex: none; }
.sc-count-line { margin: 10px 0 12px; }

/* ===== 休息计时 ===== */
#timer-overlay {
  position: fixed; inset: 0; background: rgba(58,54,44,0.55);
  display: flex; align-items: center; justify-content: center; z-index: 200;
}
#timer-box {
  background: var(--cream); border-radius: 20px; padding: 28px 34px;
  text-align: center; min-width: 230px;
}
#timer-label { color: var(--ink-sub); font-size: 14px; }
#timer-display { font-size: 52px; font-weight: 700; color: var(--main-dark); font-variant-numeric: tabular-nums; margin: 8px 0 14px; }

/* ===== ✅ 完成庆祝动效（C10） ===== */
#celebrate-overlay {
  position: fixed; inset: 0; z-index: 300;
  background: rgba(245,240,230,0.95);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  animation: celFade .4s ease;
}
#celebrate-overlay .cel-emoji { font-size: 96px; line-height: 1; animation: celPop .8s cubic-bezier(.2, 1.6, .4, 1); }
#celebrate-overlay .cel-text { margin-top: 14px; font-size: 18px; font-weight: 700; color: var(--main-dark); }
@keyframes celPop { 0% { transform: scale(0); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
@keyframes celFade { from { opacity: 0; } to { opacity: 1; } }

/* ===== 动作库 ===== */
.lib-item { padding: 12px 0; border-bottom: 1px solid var(--border); }

/* ===== 警告（浅底克制：橙=安全语义，红=红旗，soft=轻提醒） ===== */
.alert-red {
  background: var(--danger-bg); border: 1px solid var(--danger); color: var(--danger);
  border-radius: var(--radius-sm); padding: 12px; margin-bottom: 12px; font-size: 14px;
}
.alert-orange {
  background: var(--warn-bg); border: 1px solid var(--warn); color: var(--warn-ink);
  border-radius: var(--radius-sm); padding: 12px; margin-bottom: 12px; font-size: 14px;
}
.alert-soft {
  background: var(--cream); border: 1px solid var(--accent-soft); color: var(--accent);
  border-radius: var(--radius-sm); padding: 12px; margin-bottom: 12px; font-size: 14px;
}

/* ===== B9 卡片式周视图 ===== */
.week-progress { display: flex; gap: 4px; margin: 10px 0; }
.week-progress .seg { flex: 1; height: 8px; border-radius: 4px; background: var(--border); }
.week-progress .seg.done { background: var(--main-bg); }
.week-progress .seg.cur { background: var(--main); }
.day-cards { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.day-card {
  border-radius: 12px; padding: 8px 3px; text-align: center;
  font-size: 11px; border: 1.5px solid transparent; position: relative;
}
.day-card .dc-dow { font-weight: 700; font-size: 12px; color: var(--ink); }
.day-card .dc-emoji { font-size: 17px; line-height: 1.3; }
.day-card .dc-line { font-size: 10px; color: var(--ink-sub); }
.day-card.t-strength { background: var(--main-bg); border-color: var(--main); }
.day-card.t-cardio { background: var(--cardio-bg); border-color: var(--cardio); }
.day-card.t-posture { background: var(--posture-bg); border-color: var(--posture); }
.day-card.t-rest { background: var(--rest-bg); border-color: transparent; }
.day-card.is-today { transform: scale(1.08); box-shadow: 0 2px 8px rgba(58,54,44,0.06); z-index: 1; }
.day-card .dc-done { position: absolute; top: -6px; right: -3px; font-size: 13px; }
.week-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.week-nav .btn { min-height: 38px; padding: 0 12px; font-size: 14px; }

/* 计划页动作清单卡片 */
.plan-ex {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px;
}
.plan-ex:last-child { border-bottom: none; }
.plan-ex .pe-meta { font-size: 12px; color: var(--ink-sub); text-align: right; }

/* ===== 分享卡 ===== */
.share-img { width: 100%; border-radius: var(--radius-card); border: 1px solid var(--border); }

.photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.photo-grid img { width: 100%; border-radius: var(--radius-sm); aspect-ratio: 3/4; object-fit: cover; }

/* ===== V1.4：执行页「换动作」弹层（推荐替代 / 自己挑一个，两区滚动） ===== */
.swap-sec-head {
  font-size: 13px; font-weight: 700; color: var(--ink);
  letter-spacing: .02em; margin: 10px 0 6px;
}
.swap-sec-head:first-of-type { margin-top: 2px; }
.swap-divider { height: 1px; background: var(--border); margin: 8px 0 0; }
.swap-list {
  max-height: 188px; overflow-y: auto;
  display: flex; flex-direction: column; gap: 6px;
  padding: 2px 2px 4px 0;
}
.swap-row {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  width: 100%; min-height: 44px; padding: 7px 12px;
  text-align: left; cursor: pointer;
  background: var(--cream); color: var(--ink);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-size: 14px; font-family: inherit;
}
.swap-row:active { opacity: .8; }
.swap-name { display: inline-flex; align-items: center; flex-wrap: wrap; }
.swap-name .part-tag { margin-left: 6px; }
.swap-name .part-tag:first-of-type { margin-left: 0; }
.swap-row .swap-type {
  flex: none; font-size: 11px; color: var(--ink-sub);
  background: var(--bg); padding: 2px 9px; border-radius: 999px; white-space: nowrap;
}

/* ===== V1.4：动作库拍器械识别入口 / 识别结果 / 免责条 ===== */
.vision-cta { padding: 14px 16px; }
.vision-cta .btn { min-height: 50px; font-size: 16px; }
.vision-note { margin: 2px 0 12px; font-size: 13px; }

</style>
</head>
<body>
<div id="app">
  <header id="app-header">
    <h1 id="page-title">今天</h1>
  </header>

  <main id="main">
    <section id="page-today" class="page"></section>
    <section id="page-plan" class="page hidden"></section>
    <section id="page-progress" class="page hidden"></section>
    <section id="page-library" class="page hidden"></section>
    <section id="page-settings" class="page hidden"></section>
    <section id="page-onboarding" class="page hidden"></section>
  </main>

  <nav id="tabbar">
    <button class="tab" data-page="today"><span class="tab-ico">🏋️</span><span class="tab-lbl">今天</span></button>
    <button class="tab" data-page="plan"><span class="tab-ico">🗓️<i class="tab-dot"></i></span><span class="tab-lbl">计划</span></button>
    <button class="tab" data-page="progress"><span class="tab-ico">📈</span><span class="tab-lbl">进展</span></button>
    <button class="tab" data-page="library"><span class="tab-ico">📖</span><span class="tab-lbl">动作库</span></button>
    <button class="tab" data-page="settings"><span class="tab-ico">⚙️</span><span class="tab-lbl">设置</span></button>
  </nav>
</div>

<div id="celebrate-overlay" class="hidden">
  <div class="cel-emoji">✅</div>
  <div class="cel-text" id="celebrate-text"></div>
</div>

<div id="modal-root"></div>
<div id="timer-overlay" class="hidden">
  <div id="timer-box">
    <div id="timer-label">休息</div>
    <div id="timer-display">00:00</div>
    <button id="timer-skip" class="btn btn-secondary">跳过</button>
  </div>
</div>

<script>
/* data.js — 8周计划、动作库、文案常量（代码内配置，不入库） */

/* V1.3 C3 / V1.4：notes 兼容读法。有 notes 用 notes；缺 notes 时才回退 kneeCaution。
   登山机自 V1.4 起不再标注部位（其膝部保护由 bodyStatus==='knee' 时的器械置灰承担）。 */
function exerciseNotes(ex) {
  if (!ex) return [];
  if (Array.isArray(ex.notes) && ex.notes.length) return ex.notes;
  return ex.kneeCaution ? ['knee'] : [];
}
function hasBodyNote(ex, part) { return exerciseNotes(ex).indexOf(part) !== -1; }

/* V1.4：识别 prompt 文本（OpenAI 兼容 messages 的 text 部分）。从 EXERCISES 自动生成动作清单。 */
function buildVisionPromptText() {
  const lines = Object.keys(EXERCISES).map(id => {
    const ex = EXERCISES[id];
    const tag = { lower: '下肢', upper: '上肢', core: '核心', posture: '体态', cardio: '有氧' }[ex.target] || ex.target;
    return id + ': ' + ex.name + '（' + tag + '）';
  });
  return '你是一名健身器械识别助手。下面是动作库清单：\n' + lines.join('\n') +
    '\n\n请判断图中这台健身器械/正在做的动作最接近清单中的哪一项。' +
    '只返回 JSON，不要输出任何其他文字或代码块包裹，格式为：' +
    '{"matchId": "动作 id 或 null", "guide": "50-100字中文：这台器械主要练哪里、发力要点、注意"}。' +
    '如果图片里不是健身器械、或无法判断，matchId 填 null，guide 可写一句简短说明。';
}

/* V1.4：JSON 容错提取。容忍模型返回 ```json 包裹或前后多余文字，取第一个 { 到最后一个 } 之间的内容。 */
function extractVisionJson(text) {
  if (!text) return null;
  const s = String(text);
  const a = s.indexOf('{');
  const b = s.lastIndexOf('}');
  if (a === -1 || b === -1 || b <= a) return null;
  let obj;
  try { obj = JSON.parse(s.slice(a, b + 1)); } catch (e) { return null; }
  if (!obj || typeof obj !== 'object') return null;
  return {
    matchId: (typeof obj.matchId === 'string' && obj.matchId) ? obj.matchId : null,
    guide: (typeof obj.guide === 'string' && obj.guide) ? obj.guide : ''
  };
}

/* V1.4：换动作「自己挑一个」候选——同 target，排除自身与当日计划已含动作 */
function sameTargetCandidates(exerciseId, takenIds) {
  const src = EXERCISES[exerciseId];
  if (!src) return [];
  return Object.values(EXERCISES).filter(ex =>
    ex.id !== exerciseId &&
    ex.target === src.target &&
    (!takenIds || takenIds.indexOf(ex.id) === -1)
  );
}

/* V1.4：加到今日训练的模板字段补齐——取该动作在模板字典中的首条默认
 * （sets/rir 按当前周档位，rest/perSide/timed 取字典默认；找不到时用保守兜底）。 */
function planDefaultsFor(exerciseId, weekIndex) {
  for (const tid of Object.keys(TEMPLATES)) {
    const tpl = TEMPLATES[tid];
    const cand = (tpl.exercises || []).find(e => e.exerciseId === exerciseId);
    if (cand) {
      const p = planFor(cand, weekIndex || 1);
      const ex = EXERCISES[exerciseId] || {};
      return {
        exerciseId, reps: cand.reps, sets: p.sets, rir: p.rir, rest: cand.rest,
        main: !!cand.main, perSide: !!cand.perSide || !!ex.perSide, timed: !!cand.timed || !!ex.timed
      };
    }
  }
  const ex = EXERCISES[exerciseId] || {};
  return {
    exerciseId, reps: [8, 12], sets: 2, rir: 3, rest: 60,
    main: false, perSide: !!ex.perSide, timed: !!ex.timed
  };
}

/* 按首要目标 × 每周天数生成建议排期（V1.2 SPEC A4 映射表）
   原则：天数越少力量占比越高（力量保本）；天数变化只调有氧天数；力量日不连续超 2 天 */
function suggestSchedule(goalId, days) {
  days = days || 5;
  const base = { mon: 'rest', tue: 'rest', wed: 'rest', thu: 'rest', fri: 'rest', sat: 'rest', sun: 'rest' };
  const maps = {
    fatLoss: { // 减脂：2d=1力+1有氧 3d=1力+2有氧 4d=2力+2有氧 5d=2力+3有氧
      2: { mon: 'strength', thu: 'cardio' },
      3: { mon: 'cardio', wed: 'strength', fri: 'cardio' },
      4: { mon: 'cardio', tue: 'strength', thu: 'cardio', fri: 'strength' },
      5: { mon: 'cardio', tue: 'strength', wed: 'cardio', thu: 'strength', fri: 'cardio' }
    },
    energy: { // 提升精力：同减脂
      2: { mon: 'strength', thu: 'cardio' },
      3: { mon: 'cardio', wed: 'strength', fri: 'cardio' },
      4: { mon: 'cardio', tue: 'strength', thu: 'cardio', fri: 'strength' },
      5: { mon: 'cardio', tue: 'strength', wed: 'cardio', thu: 'strength', fri: 'cardio' }
    },
    muscle: { // 增肌增力：2d=2力 3d=3力 4d=3力+1有氧 5d=4力+1有氧
      2: { mon: 'strength', thu: 'strength' },
      3: { mon: 'strength', wed: 'strength', fri: 'strength' },
      4: { mon: 'strength', tue: 'strength', wed: 'cardio', fri: 'strength' },
      5: { mon: 'strength', tue: 'strength', wed: 'cardio', thu: 'strength', fri: 'strength' }
    },
    posture: { // 改善体态：2d=2力 3d=2力+1有氧 4d=3力+1有氧 5d=3力+2有氧
      2: { mon: 'strength', thu: 'strength' },
      3: { mon: 'strength', wed: 'cardio', fri: 'strength' },
      4: { mon: 'strength', tue: 'cardio', thu: 'strength', fri: 'strength' },
      5: { mon: 'strength', tue: 'cardio', wed: 'strength', thu: 'cardio', fri: 'strength' }
    },
    habit: { // 恢复运动习惯：同改善体态
      2: { mon: 'strength', thu: 'strength' },
      3: { mon: 'strength', wed: 'cardio', fri: 'strength' },
      4: { mon: 'strength', tue: 'cardio', thu: 'strength', fri: 'strength' },
      5: { mon: 'strength', tue: 'cardio', wed: 'strength', thu: 'cardio', fri: 'strength' }
    }
  };
  const m = (maps[goalId] || maps.posture)[days] || maps.posture[5];
  return Object.assign(base, m);
}
function defaultSchedule() { return suggestSchedule('posture'); }
function trainingDayCount(schedule) { return DOW_KEYS.filter(k => schedule[k] && schedule[k] !== 'rest').length; }

/* V1.3 C2/D1：档案字段迁移与兜底（就地修改并返回） */
function normalizeProfile(p) {
  if (!p) return p;
  if (p.bodyStatus === undefined) p.bodyStatus = p.kneeNote === 'left' ? 'knee' : (p.kneeNote || 'none');
  if (p.kneeNote !== undefined) delete p.kneeNote;
  if (p.bodyStatus !== 'knee' && p.bodyStatus !== 'other') p.bodyStatus = 'none'; // 非法值兜底
  if (p.scheduleConfirmed === undefined) p.scheduleConfirmed = true; // 旧档案不打扰
  if (!p.schedule) p.schedule = defaultSchedule();
  return p;
}
function isScheduleConfirmed(profile) { return !!(profile && profile.scheduleConfirmed !== false); }

/* V1.3 C4：膝档自动规避。返回该模板当日的动作清单；knee 且动作带 knee 标注时，
   取 SUBSTITUTES 中该模板尚未包含的首个替代动作，并打 autoSub/originalId 标记。
   加载进行中/已完成 session 时直接按存储显示，不回溯替换。 */
function resolveTemplateExercises(profile, templateId) {
  const tpl = TEMPLATES[templateId];
  if (!tpl) return [];
  const src = tpl.exercises || [];
  if (!profile || profile.bodyStatus !== 'knee') return src;
  const taken = src.map(e => e.exerciseId);
  return src.map(pe => {
    const ex = EXERCISES[pe.exerciseId];
    if (!hasBodyNote(ex, 'knee')) return pe;
    const pick = (SUBSTITUTES[pe.exerciseId] || []).find(id => taken.indexOf(id) === -1);
    if (!pick) return pe;
    return Object.assign({}, pe, { exerciseId: pick, originalId: pe.exerciseId, autoSub: true });
  });
}

/* 日期→模板解析：力量日 A/B 按周交替，有氧日椭圆仪/跑步机内容交替 */
function resolveTemplateId(schedule, weekIndex, dow) { // dow 1=周一
  const type = schedule[DOW_KEYS[dow - 1]];
  if (!type || type === 'rest') return null;
  let pos = 0;
  for (let d = 1; d <= dow; d++) if (schedule[DOW_KEYS[d - 1]] === type) pos++;
  const oddWeek = weekIndex % 2 === 1;
  const oddPos = pos % 2 === 1;
  if (type === 'strength') return (oddWeek === oddPos) ? 'strengthA' : 'strengthB';
  return oddPos ? 'tuesday' : 'thursday'; // 有氧内容交替（椭圆仪＋体态 / 跑步机＋核心）
}
function weekPlan(profile, weekIndex) {
  const schedule = (profile && profile.schedule) || defaultSchedule();
  return DOW_KEYS.map((k, i) => ({
    dow: i + 1, type: schedule[k],
    templateId: resolveTemplateId(schedule, weekIndex, i + 1)
  }));
}

    '好久不见！这一次，咱们稳稳地走。'
  ]
};
function pickEncouragement(done, planned, lastWeekDone, rand) {
  let bucket;
  if (done >= planned && planned > 0) bucket = 'full';
  else if (lastWeekDone === 0 && done > 0) bucket = 'back';
  else if (done >= 3) bucket = 'most';
  else bucket = 'few';
  const arr = ENCOURAGE[bucket];
  const r = (typeof rand === 'function') ? rand() : Math.random();
  return { bucket, text: arr[Math.min(arr.length - 1, Math.floor(r * arr.length))] };
}

/* 有氧器械（仅健身房内三项） */

/* V1.5 ③：分享卡品牌署名模板（{name} 替换为客户名；客户名留空时回退默认 COPY.shareFooter） */

/* 工具：取某周某模板条目的组数与目标 RIR */
function planFor(templateEntry, weekIndex) {
  const w = Math.min(Math.max(weekIndex, 1), 8);
  const sets = Array.isArray(templateEntry.sets) ? templateEntry.sets[w - 1] : templateEntry.sets;

<script>
/* db.js — IndexedDB Promise 封装 + JSON/ZIP 导入导出 */
'use strict';

const DB_NAME = 'fitness-workbench';
const DB_VERSION = 1;
const SCHEMA_VERSION = '1.0';
const STORES = ['profile', 'sessions', 'measurements', 'photos', 'settings'];

let _dbPromise = null;

function openDB() {
  if (_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('profile')) db.createObjectStore('profile');
      if (!db.objectStoreNames.contains('sessions')) db.createObjectStore('sessions', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('measurements')) db.createObjectStore('measurements', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('photos')) db.createObjectStore('photos', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings');
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return _dbPromise;
}

function tx(db, store, mode, fn) {
  return new Promise((resolve, reject) => {
    const t = db.transaction(store, mode);
    const s = t.objectStore(store);
    let result;
    const out = fn(s);
    if (out && out.onsuccess !== undefined) {
      out.onsuccess = () => { result = out.result; };
    }
    t.oncomplete = () => resolve(result);
    t.onerror = () => reject(t.error);
    t.onabort = () => reject(t.error);
  });
}

const DB = {
  async get(store, key) {
    const db = await openDB();
    return tx(db, store, 'readonly', s => s.get(key));
  },
  async getAll(store) {
    const db = await openDB();
    return tx(db, store, 'readonly', s => s.getAll());
  },
  async put(store, value, key) {
    const db = await openDB();
    return tx(db, store, 'readwrite', s => key !== undefined ? s.put(value, key) : s.put(value));
  },
  async del(store, key) {
    const db = await openDB();
    return tx(db, store, 'readwrite', s => s.delete(key));
  },
  async clear(store) {
    const db = await openDB();
    return tx(db, store, 'readwrite', s => s.clear());
  },
  async clearAll() {
    for (const s of STORES) await DB.clear(s);
  }
};

function uuid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

/* ============ 档案 / 设置快捷访问 ============ */
async function getProfile() { return DB.get('profile', 'me'); }
async function saveProfile(p) { p.updatedAt = Date.now(); return DB.put('profile', p, 'me'); }

async function getSettings() {
  let s = await DB.get('settings', 'app');
  if (!s) {
    s = { restTimerDefault: 90, weightIncrement: 2.5, lastPhotoExportAt: null, lastBackupAt: null, schemaVersion: SCHEMA_VERSION, ignoredAdvice: [], vision: null, shareBrandName: '', shareBrandTemplate: 0, theme: 'cream', customCardio: [], mainCardio: null, rirHelpDate: null };
    await DB.put('settings', s, 'app');
  } else {
    // V1.4/1.5：旧数据读不到新字段时逐一兜底（就地补齐不持久化，保存时才写回）
    if (s.vision === undefined) s.vision = null;
    if (s.shareBrandName === undefined) s.shareBrandName = '';
    if (s.shareBrandTemplate === undefined) s.shareBrandTemplate = 0;
    if (s.theme === undefined) s.theme = 'cream';
    if (s.customCardio === undefined) s.customCardio = [];
    if (s.mainCardio === undefined) s.mainCardio = null;
    if (s.rirHelpDate === undefined) s.rirHelpDate = null;
  }
  return s;
}
async function saveSettings(s) { return DB.put('settings', s, 'app'); }

/* ============ JSON 导出 / 导入 ============ */
async function exportJSON() {
  const [profile, sessions, measurements, settings] = await Promise.all([
    getProfile(), DB.getAll('sessions'), DB.getAll('measurements'), getSettings()
  ]);
  const weeklyReviews = buildWeeklyReviews(sessions);
  const settingsOut = Object.assign({}, settings, { lastBackupAt: Date.now() });
  await saveSettings(settingsOut);
  return {
    schemaVersion: SCHEMA_VERSION,
    exportedAt: new Date().toISOString(),
    sourceDevice: navigator.userAgent || 'unknown',
    profile: profile || null,
    sessions: sessions || [],
    measurements: measurements || [],
    weeklyReviews
    // 照片不进 JSON 备份（决策 7）
  };
}

function validateImport(obj) {
  if (!obj || typeof obj !== 'object') return '文件不是有效的 JSON 对象';
  if (obj.schemaVersion !== SCHEMA_VERSION) return 'schemaVersion 不匹配（期望 ' + SCHEMA_VERSION + '，实际 ' + (obj.schemaVersion || '缺失') + '）';
  if (!Array.isArray(obj.sessions)) return 'sessions 结构缺失或不是数组';
  if (!Array.isArray(obj.measurements)) return 'measurements 结构缺失或不是数组';
  return null;
}

/* 冲突不合并：导入即覆盖（调用方需先确认） */
async function importJSON(obj) {
  const err = validateImport(obj);
  if (err) throw new Error(err);
  await DB.clear('sessions');
  await DB.clear('measurements');
  await DB.clear('profile');
  if (obj.profile) await DB.put('profile', obj.profile, 'me');
  for (const s of obj.sessions) if (s && s.id) await DB.put('sessions', s);
  for (const m of obj.measurements) if (m && m.id) await DB.put('measurements', m);
}

/* ============ 简易 ZIP（STORED 无压缩）============ */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(buf) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

/* entries: [{name: string, data: Uint8Array}] → Uint8Array (zip) */
function buildZip(entries) {
  const enc = new TextEncoder();
  const chunks = [];
  const central = [];
  let offset = 0;
  const dosTime = 0, dosDate = ((2026 - 1980) << 9) | (1 << 5) | 1;

  for (const e of entries) {
    const nameBytes = enc.encode(e.name);
    const crc = crc32(e.data);
    const size = e.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);
    lh.setUint16(4, 20, true);          // version needed
    lh.setUint16(6, 0x0800, true);      // UTF-8 flag
    lh.setUint16(8, 0, true);           // STORED
    lh.setUint16(10, dosTime, true);
    lh.setUint16(12, dosDate, true);
    lh.setUint32(14, crc, true);
    lh.setUint32(18, size, true);
    lh.setUint32(22, size, true);
    lh.setUint16(26, nameBytes.length, true);
    lh.setUint16(28, 0, true);
    chunks.push(new Uint8Array(lh.buffer), nameBytes, e.data);

    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true);
    ch.setUint16(4, 20, true);
    ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true);
    ch.setUint16(10, 0, true);
    ch.setUint16(12, dosTime, true);
    ch.setUint16(14, dosDate, true);
    ch.setUint32(16, crc, true);
    ch.setUint32(20, size, true);
    ch.setUint32(24, size, true);
    ch.setUint16(28, nameBytes.length, true);
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), nameBytes);

    offset += 30 + nameBytes.length + size;
  }

  let cdSize = 0;
  for (const c of central) cdSize += c.length;
  const eocd = new DataView(new ArrayBuffer(22));
  eocd.setUint32(0, 0x06054b50, true);
  eocd.setUint16(8, entries.length, true);
  eocd.setUint16(10, entries.length, true);
  eocd.setUint32(12, cdSize, true);
  eocd.setUint32(16, offset, true);

  let total = offset + cdSize + 22;
  const out = new Uint8Array(total);
  let pos = 0;
  for (const c of chunks) { out.set(c, pos); pos += c.length; }
  for (const c of central) { out.set(c, pos); pos += c.length; }
  out.set(new Uint8Array(eocd.buffer), pos);
  return out;
}

/* 导出照片 ZIP */
async function exportPhotosZip() {
  const photos = await DB.getAll('photos');
  if (!photos.length) throw new Error('没有可导出的照片');
  const entries = [];
  for (const p of photos) {
    const buf = new Uint8Array(await p.blob.arrayBuffer());
    const ext = (p.blob.type && p.blob.type.includes('png')) ? 'png' : 'jpg';
    entries.push({ name: p.date + '_' + p.view + '_' + p.id.slice(0, 8) + '.' + ext, data: buf });
  }
  const zip = buildZip(entries);
  const s = await getSettings();
  s.lastPhotoExportAt = Date.now();
  await saveSettings(s);
  return new Blob([zip], { type: 'application/zip' });
}

/* 触发浏览器下载 */
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
}
